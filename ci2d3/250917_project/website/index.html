<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI2D3 Ice Islands with Custom Basemap</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

    <!-- Custom Styles for Formatting -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>CI2D3 Ice Islands and Custom Basemap</h1>

    <div id="map"></div>

    <!-- Proj4js for projection definitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    
    <!-- Proj4Leaflet for custom CRS support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.min.js"></script>

    <script>

        //// SWEREF99 TM (EPSG:3006) with map's pixel origin at SWEREF99 TM coordinate (0, 0)
        var crs = new L.Proj.CRS("EPSG:42101","+proj=lcc +lat_0=0 +lon_0=-95 +lat_1=49 +lat_2=77 +x_0=0 +y_0=-8000000 +datum=WGS84 +units=m +no_defs +type=crs",
        {
            resolutions: [8192, 4096, 2048, 1024, 512, 256, 128],
            origin: [0, 0]
        });

        // L.Proj.CRS.addProj4Def("EPSG:5937","+proj=stere +lat_0=90 +lon_0=-100 +k=0.994 +x_0=2000000 +y_0=2000000 +datum=WGS84 +units=m +no_defs +type=crs");
        var map = new L.Map('map', {
            crs: crs,
            center: [75.0, -100.0],
            zoom: 4
        });

        // Initialize the map and set its view (Center on Canada's northern area for Ice Islands)
        // var map = L.map('map').setView([75.0, -100.0], 4);

         // Add custom basemap layer (Canada's Basemap from GeoGratis WMS)
        var basemap = L.tileLayer.wms('https://maps.geogratis.gc.ca/wms/canvec_en?', {
            layers: 'canvec',
            format: 'image/png',
            transparent: true,
            attribution: "&copy; Government of Canada, GeoGratis"
        }).addTo(map);
		
        // Add CI2D3 Ice Islands WMS layer
        var ci2d3Layer = L.tileLayer.wms('/geoserver/ci2d3/wms?', {
            layers: 'ci2d3:ci2d3_v1_5937',  // Replace with actual CI2D3 ice islands layer
            styles: 'ci2d3_calvingloc_sld',
            format: 'image/png',
            transparent: true,
            attribution: "CI2D3 Data"
        }).addTo(map);

    </script>
</body>
</html>
